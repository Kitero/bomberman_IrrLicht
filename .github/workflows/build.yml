name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # Oldest supported runner: the binary then runs on any newer glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libirrlicht-dev libgl1-mesa-dev libxxf86vm-dev libxext-dev \
            libpng-dev libjpeg-dev zlib1g-dev libbz2-dev xvfb xauth

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Package
        run: |
          cmake --install build --prefix dist/bomberman
          tar -C dist -czf bomberman-linux-x86_64.tar.gz bomberman

      # The game has no exit condition: surviving the timeout means it started fine.
      - name: Smoke test
        run: |
          set +e
          timeout 10 xvfb-run -a dist/bomberman/run.sh
          status=$?
          if [ "$status" -ne 124 ]; then
            echo "::error::bomberman exited early with status $status"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bomberman-linux-x86_64
          path: bomberman-linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bomberman-linux-x86_64

      - uses: softprops/action-gh-release@v2
        with:
          files: bomberman-linux-x86_64.tar.gz
          generate_release_notes: true
